<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ddox NOC Dashboard</title>
    <link rel="stylesheet" href="style.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;700&display=swap" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
</head>
<body>
    <div class="noc-container" id="nocContainer">
        <header class="noc-header">
            <h1>Global Threat Monitoring</h1>
            <button id="resetBtn" class="reset-btn">Reset Server</button>
        </header>

        <aside class="side-panel-left">
            <div class="card" style="text-align: center;">
                <h2>Current Requests/sec</h2>
                <div id="rpsValue" class="big-number text-secondary">0</div>
            </div>

            <div class="card" style="text-align: center;">
                <h2>Total Packets Received</h2>
                <div id="totalPacketsValue" class="big-number text-primary" style="font-size: 3rem;">0</div>
            </div>

            <div class="card" style="text-align: center;">
                <h2>Active Connections</h2>
                <div id="activeStudentsValue" class="big-number text-warning" style="font-size: 3rem;">0</div>
            </div>
        </aside>

        <main class="main-panel">
            <div class="card">
                <h2>Live Latency (ms)</h2>
                <div class="chart-container">
                    <canvas id="latencyChart"></canvas>
                </div>
            </div>
            
            <div class="card">
                <h2>System Resources</h2>
                
                <div style="display: flex; justify-content: space-between; font-family: var(--font-mono); font-size: 0.8rem; margin-bottom: 2px;">
                    <span class="text-secondary">SERVER HEALTH</span>
                </div>
                <div class="health-bar-container">
                    <div id="healthBar" class="health-bar"></div>
                    <div id="healthText" class="bar-text">100%</div>
                </div>

                <div style="display: flex; justify-content: space-between; font-family: var(--font-mono); font-size: 0.8rem; margin-bottom: 2px; margin-top: 10px;">
                    <span class="text-warning">CPU USAGE</span>
                </div>
                <div class="resource-bar-container">
                    <div id="cpuBar" class="resource-bar"></div>
                    <div id="cpuText" class="bar-text">1%</div>
                </div>

                <div style="display: flex; justify-content: space-between; font-family: var(--font-mono); font-size: 0.8rem; margin-bottom: 2px; margin-top: 10px;">
                    <span class="text-warning">MEMORY USAGE</span>
                </div>
                <div class="resource-bar-container">
                    <div id="ramBar" class="resource-bar"></div>
                    <div id="ramText" class="bar-text">14%</div>
                </div>
            </div>
        </main>

        <aside class="side-panel-right">
            <div class="card" style="padding: 0; border: none; background: transparent;">
                <div class="radar-container">
                    <canvas id="radarCanvas" class="radar-canvas"></canvas>
                    <div class="radar-sweep"></div>
                </div>
            </div>

            <div class="card" style="flex-grow: 1; display: flex; flex-direction: column; padding: 0.5rem;">
                <h2 style="padding-left: 0.5rem; padding-top: 0.5rem;">Live Attack Log</h2>
                <div id="terminalFeed" class="noc-terminal">
                    <!-- Logs go here -->
                </div>
            </div>
        </aside>
    </div>

    <div id="crashOverlay" class="crash-overlay">
        <h1>HTTP 503 SERVICE UNAVAILABLE</h1>
        <p class="font-mono text-primary" style="font-size: 2rem;">CRITICAL SYSTEM FAILURE</p>
    </div>

    <script src="noc.js"></script>
</body>
</html>
